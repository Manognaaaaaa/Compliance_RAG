<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compliance Assistant</title>
<meta name="description" content="Ask questions about DIFC and DFSA regulations and get answers cited to the exact rulebook page.">
<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231E3A8A' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v18M5 7l-3 6a4 4 0 0 0 8 0l-3-6M19 7l-3 6a4 4 0 0 0 8 0l-3-6M5 7h14M5 7l7-4 7 4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <main class="shell">
    <div class="top-spacer"></div>

    <div id="conversation" class="conversation" hidden></div>

    <div id="empty-state" class="empty-state">
      <div class="empty-icon">
        <svg aria-hidden="true" focusable="false" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E3A8A" stroke-width="1.5"><path d="M12 3v18M5 7l-3 6a4 4 0 0 0 8 0l-3-6M19 7l-3 6a4 4 0 0 0 8 0l-3-6M5 7h14M5 7l7-4 7 4"/></svg>
      </div>
      <h1 class="headline">Ask about policy, precedent, or procedure.</h1>

      <div class="starter-grid">
        <button type="button" class="starter-card"><span class="starter-card-text">What are the DFSA's marketing rules for financial promotions in 2024-25?</span></button>
        <button type="button" class="starter-card"><span class="starter-card-text">What data does the DIFC Data Protection Law require us to disclose to data subjects?</span></button>
        <button type="button" class="starter-card"><span class="starter-card-text">What are the filing requirements under the DFSA General Module?</span></button>
        <button type="button" class="starter-card"><span class="starter-card-text">How does the DIFC Courts handle jurisdiction over commercial disputes?</span></button>
      </div>
    </div>

    <div class="input-bar-wrap">
      <div class="input-bar">
        <textarea id="input" class="input-textarea" rows="1" placeholder="Ask a compliance question…" aria-label="Compliance question"></textarea>
        <button id="send-btn" class="send-button" type="button" disabled aria-label="Send">
          <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <p class="disclaimer">Compliance Assistant provides informational guidance only and does not constitute legal advice. Verify all determinations with counsel.</p>
    </div>

  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
